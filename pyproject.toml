[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tony"
version = "0.0.1"
description = "Proyecto TONY - asistente personal inteligente, local-first, modular y seguro."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
tony = "core.bootstrap.bootstrap:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "contracts*",
    "core*",
    "database*",
    "audit*",
    "config*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
