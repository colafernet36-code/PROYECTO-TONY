name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tony
          POSTGRES_PASSWORD: tony
          POSTGRES_DB: tony_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tony -d tony_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://tony:tony@localhost:5432/tony_test
      TEST_DATABASE_URL: postgresql+psycopg://tony:tony@localhost:5432/tony_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar TONY (con dependencias de dev)
        run: pip install -e ".[dev]"

      - name: Aplicar migraciones (alembic upgrade head)
        run: alembic upgrade head

      - name: Sintaxis de scripts de shell
        run: |
          bash -n scripts/install/install_kali.sh
          bash -n scripts/diagnostics/health_check.sh

      - name: Tests unitarios + integracion
        run: pytest tests/unit tests/integration -v
